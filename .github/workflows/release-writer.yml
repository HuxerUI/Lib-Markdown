name: Release Markdown Writer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  writer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-24.04
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out paragraph geometry SDK
        uses: actions/checkout@v4
        with:
          repository: FarnaHerry/HuxerUI
          ref: e119529d4fe118b0b4df4a0a306df6819814d7a0
          path: .cache/HuxerUI
      - name: Add attributed TextField support
        shell: pwsh
        run: |
          git -C .cache/HuxerUI fetch --no-tags https://github.com/HuxerUI/HuxerUI.git e29c3c2573dcd7db201e7523ff59803529875d52
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C .cache/HuxerUI cherry-pick --no-commit e29c3c2573dcd7db201e7523ff59803529875d52
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libepoxy-dev libsoup-3.0-dev pkg-config ninja-build rpm
      - name: Configure Writer
        shell: pwsh
        run: cmake -S examples/editor -B build-writer-release -DHUXERUI_HOME="${{ github.workspace }}/.cache/HuxerUI" -DHUXERUI_MARKDOWN_EDITOR_DOCUMENT_MODE=ON
      - name: Build Writer
        run: cmake --build build-writer-release --config Release --target markdown_editor --parallel 2
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build-writer-release/Release/markdown_editor.exe,build-writer-release/Release/markdown_editor.resources -DestinationPath markdown-writer-windows.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          tar -C build-writer-release -czf markdown-writer-linux.tar.gz markdown_editor markdown_editor.resources
          cpack --config build-writer-release/CPackConfig.cmake -G DEB -B .
          cpack --config build-writer-release/CPackConfig.cmake -G RPM -B .
      - name: Package macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build-writer-release/markdown_editor.app markdown-writer-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-writer-${{ matrix.name }}
          path: markdown-writer-*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out paragraph geometry SDK
        uses: actions/checkout@v4
        with:
          repository: FarnaHerry/HuxerUI
          ref: e119529d4fe118b0b4df4a0a306df6819814d7a0
          path: .cache/HuxerUI
      - name: Add attributed TextField support
        run: |
          git -C .cache/HuxerUI fetch --no-tags https://github.com/HuxerUI/HuxerUI.git e29c3c2573dcd7db201e7523ff59803529875d52
          git -C .cache/HuxerUI cherry-pick --no-commit e29c3c2573dcd7db201e7523ff59803529875d52
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager --install 'platforms;android-36' 'ndk;29.0.14206865'
      - name: Build HuxerUI CLI
        run: |
          cmake -S .cache/HuxerUI/tools/huxerui_cli -B build-huxerui-cli -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-huxerui-cli --parallel 2
      - name: Package installable Android demo
        working-directory: examples/editor
        run: ../../build-huxerui-cli/huxerui package android --profile debug --source ../../.cache/HuxerUI
      - name: Stage APK
        run: cp examples/editor/dist/android/*.apk markdown-writer-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-writer-android
          path: markdown-writer-android.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [writer, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: markdown-writer-*
          merge-multiple: true
          path: dist
      - name: Attach Writer packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
