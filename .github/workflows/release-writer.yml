name: Release Markdown Writer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  writer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-24.04
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out paragraph geometry SDK
        uses: actions/checkout@v4
        with:
          repository: FarnaHerry/HuxerUI
          ref: 554d9a540b40fa5a7b51125218a80166c86d8679
          path: .cache/HuxerUI
      - name: Add attributed TextField support
        shell: pwsh
        run: |
          git -C .cache/HuxerUI fetch --no-tags https://github.com/HuxerUI/HuxerUI.git 511cd16db7d7a621876ad942b5c3161ba0392c49
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C .cache/HuxerUI cherry-pick --no-commit 511cd16db7d7a621876ad942b5c3161ba0392c49
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libepoxy-dev libsoup-3.0-dev pkg-config ninja-build rpm desktop-file-utils
      - name: Configure Writer
        shell: pwsh
        run: cmake -S examples/editor -B build-writer-release -DHUXERUI_HOME="${{ github.workspace }}/.cache/HuxerUI" -DHUXERUI_MARKDOWN_EDITOR_DOCUMENT_MODE=ON
      - name: Build Writer
        run: cmake --build build-writer-release --config Release --target markdown_editor --parallel 2
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build-writer-release/Release/markdown_editor.exe,build-writer-release/Release/markdown_editor.resources -DestinationPath markdown-writer-windows.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate examples/editor/platform/linux/markdown-writer.desktop
          tar -C build-writer-release -czf markdown-writer-linux.tar.gz markdown_editor markdown_editor.resources
          cpack --config build-writer-release/CPackConfig.cmake -G DEB -B .
          cpack --config build-writer-release/CPackConfig.cmake -G RPM -B .
          dpkg-deb -c markdown-writer-*.deb | grep -q '/share/applications/markdown-writer.desktop$'
          dpkg-deb -c markdown-writer-*.deb | grep -q '/share/icons/hicolor/192x192/apps/markdown-writer.png$'
          rpm -qlp markdown-writer-*.rpm | grep -q '/share/applications/markdown-writer.desktop$'
          rpm -qlp markdown-writer-*.rpm | grep -q '/share/icons/hicolor/192x192/apps/markdown-writer.png$'
      - name: Package macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build-writer-release/markdown_editor.app markdown-writer-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-writer-${{ matrix.name }}
          path: markdown-writer-*
          if-no-files-found: error

  android:
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out paragraph geometry SDK
        uses: actions/checkout@v4
        with:
          repository: FarnaHerry/HuxerUI
          ref: 554d9a540b40fa5a7b51125218a80166c86d8679
          path: .cache/HuxerUI
      - name: Add attributed TextField support
        run: |
          git -C .cache/HuxerUI fetch --no-tags https://github.com/HuxerUI/HuxerUI.git 511cd16db7d7a621876ad942b5c3161ba0392c49
          git -C .cache/HuxerUI cherry-pick --no-commit 511cd16db7d7a621876ad942b5c3161ba0392c49
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android toolchain
        run: |
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$sdk_manager"
          printf 'y\n%.0s' {1..100} | "$sdk_manager" --licenses
          "$sdk_manager" --install 'platforms;android-36' 'ndk;29.0.14206865'
      - name: Build HuxerUI CLI
        run: |
          cmake -S .cache/HuxerUI/tools/huxerui_cli -B build-huxerui-cli -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-huxerui-cli --parallel 2
      - name: Select Android ABI
        run: sed -i 's/^huxeruiAbis=.*/huxeruiAbis=${{ matrix.abi }}/' examples/editor/platform/android/gradle.properties
      - name: Package installable Android demo
        working-directory: examples/editor
        run: ../../build-huxerui-cli/huxerui package android --profile debug --source ../../.cache/HuxerUI
      - name: Stage APK
        run: |
          apk=$(find examples/editor/dist/android -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          actual_abis=$(unzip -Z1 "$apk" | sed -n 's|^lib/\([^/]*\)/.*\.so$|\1|p' | sort -u)
          test "$actual_abis" = '${{ matrix.abi }}'
          cp "$apk" 'markdown-writer-android-${{ matrix.abi }}.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-writer-android-${{ matrix.abi }}
          path: markdown-writer-android-${{ matrix.abi }}.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [writer, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: markdown-writer-*
          merge-multiple: true
          path: dist
      - name: Attach Writer packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
