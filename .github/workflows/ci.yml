name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone parser
        run: cmake -S . -B build -DHUXERUI_MARKDOWN_BUILD_VIEW=OFF -DHUXERUI_MARKDOWN_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  native:
    name: native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: library
            source: .
            options: -DHUXERUI_MARKDOWN_BUILD_TESTS=ON
          - name: preview
            source: examples/preview
            options: -DHUXERUI_MARKDOWN_PREVIEW_BUILD_TESTS=ON
          - name: editor
            source: examples/editor
            options: -DHUXERUI_MARKDOWN_EDITOR_BUILD_TESTS=ON -DHUXERUI_MARKDOWN_EDITOR_DOCUMENT_MODE=ON
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out paragraph geometry PR 154
        uses: actions/checkout@v4
        with:
          repository: FarnaHerry/HuxerUI
          ref: 554d9a540b40fa5a7b51125218a80166c86d8679
          path: .cache/HuxerUI
      - name: Apply attributed TextField PR 153
        shell: pwsh
        run: |
          $revision = 'e29c3c2573dcd7db201e7523ff59803529875d52'
          git -C .cache/HuxerUI fetch --no-tags https://github.com/HuxerUI/HuxerUI.git $revision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C .cache/HuxerUI cherry-pick --no-commit $revision
      - name: Configure ${{ matrix.name }} independently
        run: cmake -S ${{ matrix.source }} -B build -DHUXERUI_HOME="${{ github.workspace }}/.cache/HuxerUI" -DHUXERUI_BUILD_TESTING_LIBRARY=ON ${{ matrix.options }}
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows demo
        if: matrix.name != 'library'
        uses: actions/upload-artifact@v4
        with:
          name: markdown-${{ matrix.name }}-windows
          if-no-files-found: error
          path: |
            build/Release/markdown_${{ matrix.name }}.exe
            build/Release/markdown_${{ matrix.name }}.resources/

  rich-text-editor:
    name: native (rich text editor prototype)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out paragraph geometry SDK
        uses: actions/checkout@v4
        with:
          repository: FarnaHerry/HuxerUI
          ref: 554d9a540b40fa5a7b51125218a80166c86d8679
          path: .cache/paragraph-layout-sdk
      - name: Configure
        run: cmake -S experiments/rich_text_editor -B build -DHUXERUI_HOME="${{ github.workspace }}/.cache/paragraph-layout-sdk" -DHUXERUI_BUILD_TESTING_LIBRARY=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows demo
        uses: actions/upload-artifact@v4
        with:
          name: rich-text-editor-windows
          if-no-files-found: error
          path: |
            build/Release/rich_text_editor_demo.exe
            build/Release/rich_text_editor_demo.resources/
