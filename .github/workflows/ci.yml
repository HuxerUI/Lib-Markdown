name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone parser
        run: cmake -S . -B build -DHUXERUI_MARKDOWN_BUILD_VIEW=OFF -DHUXERUI_MARKDOWN_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  native:
    name: native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: library
            source: .
            options: -DHUXERUI_MARKDOWN_BUILD_TESTS=ON
          - name: preview
            source: examples/preview
            options: -DHUXERUI_MARKDOWN_PREVIEW_BUILD_TESTS=ON
          - name: editor
            source: examples/editor
            options: -DHUXERUI_MARKDOWN_EDITOR_BUILD_TESTS=ON
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out verified HuxerUI revision
        uses: actions/checkout@v4
        with:
          repository: HuxerUI/HuxerUI
          ref: cadb1696cfa7b87d9d2d316b3ecba07b85a46962
          path: .cache/HuxerUI
      - name: Configure ${{ matrix.name }} independently
        run: cmake -S ${{ matrix.source }} -B build -DHUXERUI_HOME="${{ github.workspace }}/.cache/HuxerUI" -DHUXERUI_BUILD_TESTING_LIBRARY=ON ${{ matrix.options }}
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows demo
        if: matrix.name != 'library'
        uses: actions/upload-artifact@v4
        with:
          name: markdown-${{ matrix.name }}-windows
          if-no-files-found: error
          path: |
            build/Release/markdown_${{ matrix.name }}.exe
            build/Release/markdown_${{ matrix.name }}.resources/
